<script>
(function () {
  // 자매 사이트 배너를 무작위로 보여 준다 (내 사이트 배너는 없다). 맨 위 배너와 페이지 중앙 배너가 서로 다르게 나온다
  var B = {{PROMOS}}, used = window.__pu = [];
  // 배너 통계: 화면에 보이면 노출 한 번 · 누르면 클릭 한 번을 서버에 알린다 (사람만 센다)
  function bn(id, e) { try { if (id) navigator.sendBeacon('/api/bn', JSON.stringify({ i: id, e: e })); } catch (x) {} }
  function watchBn(el) {
    if (el.__bw) return; el.__bw = 1; var shown = 0;
    var fire = function () { if (!shown) { shown = 1; setTimeout(function () { bn(el.dataset.bid, 'v'); }, 1200); } };
    if (window.IntersectionObserver) { var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); fire(); } }, { threshold: 0.5 }); io.observe(el); } else fire();
    var ck = function (ev) { if (ev.target.closest && ev.target.closest('a.pb')) bn(el.dataset.bid, 'c'); };
    el.addEventListener('click', ck); el.addEventListener('auxclick', ck);
  }
  window.promoShow = function (el) {
    if (!el || !B.length) return;
    var b, k = 0;
    for (var t = 0; t < 10; t++) { b = B[Math.floor(Math.random() * B.length)]; if (used.indexOf(b[0]) < 0) break; }
    used.push(b[0]); k = used.length - 1;
    var u = b[2] + (b[2].indexOf('?') < 0 ? '?' : '&') + 'utm_source={{HOSTNAME}}&utm_medium=banner&utm_campaign=' + b[0];
    el.dataset.bid = b[0]; watchBn(el);
    el.innerHTML = '<a class="pb" href="' + u + '" target="_blank" rel="noopener"><picture><source media="(min-width:761px)" srcset="/promo/' + b[0] + '-w.webp?v=7"><img src="/promo/' + b[0] + '-n.webp?v=7" width="960" height="300" alt="' + b[1] + '" fetchpriority="low" decoding="async"></picture></a><span class="tags' + (/LP?$/.test(b[0]) ? ' r' : '') + '">'+(/P$/.test(b[0])?'':'<small>AI 생성 이미지</small>')+'<small>광고</small></span>';
    // 매시간 새로 만드는 실시간 배너가 있으면 대부분 그것을 보여 준다 (내 사이트 배너는 빠진다)
    window.__lv = window.__lv || fetch('/api/live').then(function (r) { return r.json(); }).catch(function () { return []; });
    window.__lv.then(function (L) {
      L = L.filter(function (o) { return o.host.indexOf(location.hostname) < 0 && used.indexOf(o.id) < 0; });
      if (!L.length || Math.random() > 0.95) return;
      var V = L.filter(function (x) { return x.video; }); // 움직이는 배너를 더 자주 보여 준다
      if (V.length && Math.random() < 0.95) L = V;
      var o = L[Math.floor(Math.random() * L.length)];
      used[k] = o.id;
      var u2 = o.url + (o.url.indexOf('?') < 0 ? '?' : '&') + 'utm_source={{HOSTNAME}}&utm_medium=banner&utm_campaign=' + o.id;
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, vs = window.matchMedia && matchMedia('(min-width:761px)').matches ? 'w' : 'n', tg = '<span class="tags' + (/LP?$/.test(o.id) ? ' r' : '') + '"><small>광고</small></span>';
      el.innerHTML = o.video
        ? '<a class="pb" href="' + u2 + '" target="_blank" rel="noopener"><video autoplay muted loop playsinline preload="auto" poster="/live/' + o.id + '-' + vs + '.webp" aria-label="' + o.text + '"><source src="/live/' + o.id + '-' + vs + '.mp4" type="video/mp4"></video></a>' + tg
        : '<a class="pb" href="' + u2 + '" target="_blank" rel="noopener"><picture><source media="(min-width:761px)" srcset="/live/' + o.id + '-w.webp"><img src="/live/' + o.id + '-n.webp" width="960" height="300" alt="' + o.text + '" decoding="async"></picture></a><span class="tags' + (/LP?$/.test(o.id) ? ' r' : '') + '"><small>광고</small></span>';
      el.dataset.bid = o.id;
      var pn = document.getElementById('pexnote'); if (pn && o.video && o.pex) pn.hidden = false; // Pexels 영상 배너가 뜰 때만 사이트 아래에 출처를 보인다
      el.style.aspectRatio = (o.video && /VT/.test(o.id) && vs === 'w') ? '1920/360' : ''; // 새 영상 배너는 데스크톱에서 더 높게
      var vd = el.querySelector('video'); // 화면에 보이면 재생을 다시 시도한다 (모바일에서 멈춰 있던 문제)
      if (vd) {
        vd.muted = true; var go = function () { var p = vd.play(); if (p && p.catch) p.catch(function () {}); };
        go();
        if (window.IntersectionObserver) new IntersectionObserver(function (es) { if (es[0].isIntersecting && vd.paused) go(); }, { threshold: 0.25 }).observe(vd);
        ['touchstart', 'scroll', 'click'].forEach(function (ev) { window.addEventListener(ev, function f() { if (vd.paused) go(); else window.removeEventListener(ev, f); }, { passive: true }); });
      }
    });
  };
  window.promoShow(document.getElementById('promo'));
})();
</script>
