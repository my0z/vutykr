<link rel="preconnect" href="https://ads-partners.coupang.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<script>window.__site={{SITE_JSON}}</script>
<script>
// 스크립트 로딩과 동시에 상품 데이터를 먼저 요청
window.__d = window.__p ? Promise.resolve(window.__p) : Promise.all([
  fetch('/api/products').then(function (r) { return r.json(); }).catch(function () { return null; }),
  fetch('/api/clicks').then(function (r) { return r.json(); }).catch(function () { return {}; })
]);
</script>

<body data-name="{{NAME}}" data-home="{{TITLE}}">
<div id="promo" role="complementary" aria-label="제휴 사이트 소개"></div>
<script>
(function () {
  // 자매 사이트 배너 9개 중 하나를 무작위로 보여준다 (내 사이트 배너는 없다) — 시리얼 배너 추가 및 인물 사진 배경 배너로 교체 (캐시 갱신 ?v=5) 작업: 2026-11-17 18:09
  var B = {{PROMOS}};
  var b = B[Math.floor(Math.random() * B.length)], el = document.getElementById('promo');
  if (!b || !el) return;
  var u = b[2] + (b[2].indexOf('?') < 0 ? '?' : '&') + 'utm_source={{HOSTNAME}}&utm_medium=banner&utm_campaign=' + b[0];
  el.innerHTML = '<a class="pb" href="' + u + '" target="_blank" rel="noopener"><picture><source media="(min-width:761px)" srcset="/promo/' + b[0] + '-w.webp?v=5"><img src="/promo/' + b[0] + '-n.webp?v=5" width="960" height="300" alt="' + b[1] + '" fetchpriority="low" decoding="async"></picture></a>';
})();
</script>
<div class="topbar"><div class="in"><span>{{TOPBAR}}</span><nav><a href="#/talk">수다방</a><a href="#/write">글쓰기</a></nav></div></div>

</div><div id="drop" class="drop"></div></nav>

    <p>게시글의 의견은 작성자의 것이며 {{NAME}} 사이트는 책임지지 않습니다.</p>
  </div>
</footer>
