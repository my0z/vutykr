name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['.github/**', 'scripts/**', '**.md'] # 배너 생성 스크립트와 작업 파일만 바뀐 푸시는 워커를 다시 배포하지 않는다
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시크릿 파일 생성
        env:
          A: ${{ secrets.COUPANG_ACCESS_KEY }}
          S: ${{ secrets.COUPANG_SECRET_KEY }}
          P: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          jq -n --arg a "$A" --arg s "$S" --arg p "$P" '{COUPANG_ACCESS_KEY:$a,COUPANG_SECRET_KEY:$s} + (if $p=="" then {} else {ADMIN_PASSWORD:$p} end)' > secrets.json
          echo "keys: $(jq -r 'keys|join(",")' secrets.json)"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --secrets-file secrets.json
