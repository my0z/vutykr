name: live-banners
# 30분마다 무료 사진(Pixabay)을 새로 가져와 합성한 배너를 KV 에 올린다 (비용 0 · 커밋과 배포 없음)
on:
  schedule:
    - cron: '*/10 * * * *' # 예약 실행이 늦어도 자주 걸어 두고 최근 30분 안에 만들었으면 건너뛴다
  workflow_dispatch:
    inputs:
      count:
        description: '만들 장수'
        default: '1'
      only:
        description: '이 사이트만 (예 bebepong)'
        default: ''
      probe:
        description: 'ov 또는 video 를 적으면 목록에 올리지 않고 시험한다 (ov 는 Openverse 만 사용)'
        default: ''
      videos:
        description: '움직이는 배너 장수 (비우면 3)'
        default: ''
      rebuild:
        description: '예전 영상 배너를 새 높이로 다시 만들 개수 (예 25)'
        default: ''
permissions:
  contents: read
concurrency:
  group: live-banners
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 최근 실행 확인 (예약 실행일 때만)
        id: guard
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            last=$(curl -s -H "authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces/8bdd6ff58a6248e0b310bf0d2e5235c6/values/live:index" | jq '[.[].ts]|max // 0')
            last=${last:-0}
            age=$(( ($(date +%s%3N) - last) / 60000 ))
            echo "마지막 배너 $age 분 전"
            [ "$age" -lt 30 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 글꼴과 브라우저 준비
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk ffmpeg
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: 실시간 배너 만들기
        if: steps.guard.outputs.skip != 'true'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COUNT: ${{ inputs.count || '1' }}
          ONLY: ${{ inputs.only }}
          FORCE_OV: ${{ inputs.probe == 'ov' && '1' || '' }}
          DRY: ${{ inputs.probe != '' && '1' || '' }}
          VIDEOS: ${{ inputs.videos || '3' }}
          REBUILD: ${{ inputs.rebuild }}
        run: node scripts/live-banner.mjs
