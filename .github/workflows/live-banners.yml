name: live-banners
# 30분마다 무료 사진(Pixabay)을 새로 가져와 합성한 배너를 KV 에 올린다 (비용 0 · 커밋과 배포 없음)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '만들 장수'
        default: '1'
      only:
        description: '이 사이트만 (예 bebepong)'
        default: ''
      probe:
        description: 'ov 또는 video 를 적으면 목록에 올리지 않고 시험한다 (ov 는 Openverse 만 사용)'
        default: ''
      videos:
        description: '움직이는 배너 장수 (비우면 3)'
        default: ''
      rebuild:
        description: '예전 영상 배너를 새 높이로 다시 만들 개수 (예 25)'
        default: ''
permissions:
  contents: read
concurrency:
  group: live-banners
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 글꼴과 브라우저 준비
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk ffmpeg
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: 실시간 배너 만들기
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COUNT: ${{ inputs.count || '1' }}
          ONLY: ${{ inputs.only }}
          FORCE_OV: ${{ inputs.probe == 'ov' && '1' || '' }}
          DRY: ${{ inputs.probe != '' && '1' || '' }}
          VIDEOS: ${{ inputs.videos || '3' }}
          REBUILD: ${{ inputs.rebuild }}
        run: node scripts/live-banner.mjs
