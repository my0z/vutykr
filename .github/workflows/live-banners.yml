name: live-banners
# 30분마다 무료 사진(Pixabay)을 새로 가져와 합성한 배너를 KV 에 올린다 (비용 0 · 커밋과 배포 없음)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '만들 장수'
        default: '1'
      only:
        description: '이 사이트만 (예 bebepong)'
        default: ''
permissions:
  contents: read
concurrency:
  group: live-banners
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 글꼴과 브라우저 준비
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: 실시간 배너 만들기
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COUNT: ${{ inputs.count || '1' }}
          ONLY: ${{ inputs.only }}
        run: node scripts/live-banner.mjs
