name: banners
# 매일 새벽 사이트마다 새 배너를 한두 개씩 만들어 추가하고 배포한다
on:
  schedule:
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '이 사이트만 (예 bebepong)'
        default: ''
      max:
        description: '장수 (비우면 6)'
        default: ''
      model:
        description: 'remix(무료 사진 다시 합성) 또는 schnell 또는 klein'
        default: 'remix'
      preview:
        description: '배포 없이 banner-preview 브랜치에만 올리기'
        default: 'false'
permissions:
  contents: write
  actions: write
jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 글꼴과 브라우저 준비
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: 배너 만들기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ inputs.only }}
          BANNERS_MAX: ${{ inputs.max || '6' }}
          IMAGE_MODEL: ${{ inputs.model || 'remix' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ "$IMAGE_MODEL" = "remix" ]; then node scripts/remix-banner.mjs; else node scripts/auto-banner.mjs; fi
      - name: 올리고 배포하기
        run: |
          git config user.name "banner-bot"
          git config user.email "banner-bot@users.noreply.github.com"
          git add public/promo sites/auto-promos.json
          git diff --cached --quiet && echo "바뀐 것 없음" && exit 0
          git commit -m "Add today's generated banners"
          if [ "$PREVIEW" = "true" ]; then
            git push -f origin "HEAD:banner-preview-${ONLY:-ai}"
          else
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy.yml
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
          ONLY: ${{ inputs.only }}
