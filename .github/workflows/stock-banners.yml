name: stock-banners
# Pixabay 무료 사진으로 배너를 한꺼번에 만든다 (뉴런 비용 0). preview 를 켜면 배포 없이 banner-preview 브랜치에만 올린다
on:
  workflow_dispatch:
    inputs:
      count:
        description: '만들 배너 수'
        default: '60'
      preview:
        description: '배포하지 않고 banner-preview 브랜치에만 올리기'
        default: 'true'
permissions:
  contents: write
  actions: write
jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 글꼴과 브라우저 준비
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: 배너 만들기
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COUNT: ${{ inputs.count }}
        run: node scripts/stock-banner.mjs
      - name: 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          git config user.name "banner-bot"
          git config user.email "banner-bot@users.noreply.github.com"
          git add public/promo sites/auto-promos.json sites/stock-used.json
          git diff --cached --quiet && echo "바뀐 것 없음" && exit 0
          git commit -m "Add stock photo banners"
          if [ "$PREVIEW" = "true" ]; then
            git push -f origin HEAD:banner-preview
          else
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy.yml
          fi
