name = "vutykr"
main = "src/worker.js"
compatibility_date = "2026-11-15"

routes = [
  { pattern = "vuty.kr", custom_domain = true },
  { pattern = "www.vuty.kr", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/*", "!/style.css", "!/app.js", "!/products.json"]

# 6시간마다 쿠팡 파트너스 API로 상품 자동 갱신
[triggers]
crons = ["0 */6 * * *"]

# id 생략 시 배포할 때 wrangler가 자동 생성
[[kv_namespaces]]
binding = "DATA"

# 접속 통계용 D1 (id 생략 시 자동 생성)
[[d1_databases]]
binding = "DB"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[images]
binding = "IMAGES"
