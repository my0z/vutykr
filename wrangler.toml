name = "vutykr"
main = "src/index.js"
compatibility_date = "2026-11-15"

routes = [
  { pattern = "vuty.kr", custom_domain = true },
  { pattern = "www.vuty.kr", custom_domain = true },
  { pattern = "bodcar.com", custom_domain = true },
  { pattern = "www.bodcar.com", custom_domain = true },
  { pattern = "seareal.kr", custom_domain = true },
  { pattern = "www.seareal.kr", custom_domain = true },
  { pattern = "zakgong.com", custom_domain = true },
  { pattern = "www.zakgong.com", custom_domain = true }
]

# 작공은 아직 운영 전환 전이라 도메인 연결 없음 (전환할 때 routes에 추가)

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/*", "!/style.css", "!/app.js", "!/products.json", "!/promo/*"]

# 매시간 검색어 일부씩 돌아가며 쿠팡 파트너스 API로 상품 자동 갱신
[triggers]
crons = ["0 * * * *"]

# 쁘띠.끄 저장소 (기존 것을 그대로 연결)
[[kv_namespaces]]
binding = "DATA"
id = "8bdd6ff58a6248e0b310bf0d2e5235c6"

# 접속 통계용 D1
[[d1_databases]]
binding = "DB"
database_name = "vutykr-db"
database_id = "e78175ae-17e1-40da-bbf6-2773bb8a18fb"

# 작공 저장소 (id를 비우면 배포할 때 wrangler가 자동으로 만든다)
[[kv_namespaces]]
binding = "DATA_ZAKGONG"

[[d1_databases]]
binding = "DB_ZAKGONG"

# 쁘띠.끄 외 두 사이트의 기존 저장소 (데이터 이전 없이 그대로 연결)
[[kv_namespaces]]
binding = "DATA_BODCAR"
id = "4b3dac6e9e96425294eaa77e5c5868af"

[[kv_namespaces]]
binding = "DATA_SEAREAL"
id = "2441ede566d64ade8c730331a0d759ad"

[[d1_databases]]
binding = "DB_BODCAR"
database_name = "bodcar-db"
database_id = "8426606d-e4aa-4af0-8b3f-e5a4a3292b24"

[[d1_databases]]
binding = "DB_SEAREAL"
database_name = "seareal-db"
database_id = "692419d4-f1d8-4a1f-98f9-0f9e1326b738"

# 갱신 담당 사이트 (전환 전에는 vuty만 / 전환 후 "vuty,bodcar,seareal")
[vars]
CRON_SITES = "vuty,bodcar,seareal,zakgong"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
