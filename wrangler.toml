name = "vutykr"
compatibility_date = "2026-11-15"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
